name: Checks

# Pull requests and manual runs only while the project is solo: a push to main has
# nothing to protect that a pull request would not catch later. Add push back when a
# second contributor arrives.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The main suite takes about five minutes on a clean runner. The two fixture
    # suites in the parallel `fixtures` job start a separate type-aware linter
    # process per case, so they stay out of this job instead of contending with
    # every other test on four cores.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3 4; do
            if bunx playwright install --with-deps chromium; then exit 0; fi
            echo "Browser install attempt $attempt failed; retrying after a pause."
            sleep $((attempt * 20))
          done
          echo "Browser install failed after four attempts."
          exit 1

      - run: bun run checks:ci:main

  # The dependency and lint fixture suites each exercise the real toolchain in a
  # temporary project. Running them beside the main suite makes both slower; this
  # job gives them their own runner and runs in parallel with `checks`.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run checks:ci:fixtures

  # Validates production artifacts without cloud credentials: marker scans and a Worker dry run.
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run targets:verify

  e2e:
    name: e2e (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The container target is the production artifact, so it is the only end to end
        # target that runs here. The plain Node target runs the same application and stays
        # available locally as `bun run test:e2e`. Cloudflare is not a deployment we support,
        # so its end to end target is not part of this workflow; if it becomes one, its
        # pieces join here and run when they change.
        target: [container]
    # Each run starts its own disposable PostgreSQL container with the runner's Docker.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3 4; do
            if bunx playwright install --with-deps chromium; then exit 0; fi
            echo "Browser install attempt $attempt failed; retrying after a pause."
            sleep $((attempt * 20))
          done
          echo "Browser install failed after four attempts."
          exit 1

      - name: Run target E2E and owned infrastructure safety suites
        run: node e2e/test.ts --target ${{ matrix.target }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-${{ matrix.target }}
          path: |
            e2e/playwright-report
            e2e/test-results
            .artifacts/e2e
          archive: true
          retention-days: 7
          # The run's logs and cleanup record live under the hidden .artifacts directory.
          include-hidden-files: true
